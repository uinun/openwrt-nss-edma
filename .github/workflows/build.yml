name: Build OpenWrt NSS Firmware

on:
  workflow_dispatch:
    inputs:
      router:
        description: Select router to build
        required: true
        default: all
        type: choice
        options:
          - all
          - homewrk
          - mx4200v2


env:
  OPENWRT_DIR: openwrt-nss-edma


jobs:

  prepare:
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:

    - name: Generate matrix
      id: set-matrix
      run: |

        if [ "${{ github.event.inputs.router }}" = "homewrk" ]; then

          echo 'matrix={"router":[{"name":"homewrk","config":"configs/homewrk","target":"ipq807x","subtarget":"generic"}]}' >> $GITHUB_OUTPUT

        elif [ "${{ github.event.inputs.router }}" = "mx4200v2" ]; then

          echo 'matrix={"router":[{"name":"mx4200v2","config":"configs/mx4200v2","target":"ipq807x","subtarget":"generic"}]}' >> $GITHUB_OUTPUT

        else

          echo 'matrix={"router":[{"name":"homewrk","config":"configs/homewrk","target":"ipq807x","subtarget":"generic"},{"name":"mx4200v2","config":"configs/mx4200v2","target":"ipq807x","subtarget":"generic"}]}' >> $GITHUB_OUTPUT

        fi



  build:

    needs: prepare

    strategy:
      max-parallel: 1

      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}


    runs-on: ubuntu-24.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang \
          flex \
          bison \
          g++ \
          gawk \
          gcc-multilib \
          gettext \
          git \
          libncurses-dev \
          libssl-dev \
          libelf-dev \
          python3 \
          python3-setuptools \
          rsync \
          unzip \
          zstd \
          file


    - name: Clone OpenWrt
      run: |
        git clone \
        --depth=1 \
        -b nss-edma-rework \
        https://github.com/JuliusBairaktaris/openwrt-nss-edma.git \
        $OPENWRT_DIR


    - name: Add NSS feed
      working-directory: ${{ env.OPENWRT_DIR }}

      run: |

        cp feeds.conf.default feeds.conf

        echo \
        "src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss" \
        >> feeds.conf


    - name: Update feeds
      working-directory: ${{ env.OPENWRT_DIR }}

      run: |

        ./scripts/feeds update -a

        ./scripts/feeds install -a

        ./scripts/feeds list -r nss | grep -q qca-nss-drv


    - name: Copy config
      run: |

        cd $OPENWRT_DIR

        test -f ../${{ matrix.router.config }}/diffconfig

        cp ../${{ matrix.router.config }}/diffconfig .config

        if [ -d ../${{ matrix.router.config }}/files ]; then
          cp -a ../${{ matrix.router.config }}/files .
        fi


    - name: Generate configuration


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        make defconfig


    - name: Download sources


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        make download -j$(nproc)


    - name: Build firmware


      working-directory: ${{ env.OPENWRT_DIR }}


      run: |

        make -j$(nproc) V=s



    - name: Upload firmware
      uses: actions/upload-artifact@v4

      with:

        name: ${{ matrix.router.name }}-${{ matrix.router.target }}-firmware

        path: |
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sysupgrade*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*factory*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sha256*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*profiles*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*manifest*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*buildinfo*

        if-no-files-found: error

        retention-days: 30