name: Build Openwrt NSS firmware

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: '请选择要编译的路由器机型 (Select device)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - homewrk
          - mx4300

permissions:
  contents: read

env:
  UPSTREAM_REPO: JuliusBairaktaris/openwrt-nss-edma
  UPSTREAM_REF: nss-edma-rework
  COMMON: common
  VARIANT: edma-nss
  OPENWRT_DIR: openwrt-nss-edma
  FEEDS: "src-git luci https://github.com/JuliusBairaktaris/luci.git;luci-app-ppe-qos"

jobs:
  # 步骤 1：解析用户输入，动态生成 matrix
  setup-matrix:
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.set-devices.outputs.devices }}
    steps:
      - id: set-devices
        run: |
          SELECTED="${{ github.event.inputs.target_device }}"
          if [ "$SELECTED" = "all" ]; then
            # 当选择 all 时，包含两个设备
            echo 'devices=["homewrk", "mx4300"]' >> "$GITHUB_OUTPUT"
          else
            # 当选择单一设备时，只包含该设备
            echo "devices=[\"$SELECTED\"]" >> "$GITHUB_OUTPUT"
          fi

  # 步骤 2：并行/独立构建
  build:
    needs: setup-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.setup-matrix.outputs.devices) }}

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
          rsync unzip zlib1g-dev file which bzip2 patch

    - name: Checkout builder
      uses: actions/checkout@v4
      with:
        path: builder

    - name: Checkout openwrt-nss-edma
      uses: actions/checkout@v4
      with:
        repository: ${{ env.UPSTREAM_REPO }}
        ref: ${{ env.UPSTREAM_REF }}
        path: ${{ env.OPENWRT_DIR }}

    - name: Prepare build environment
      env:
        OPENWRT_DIR: ${{ env.OPENWRT_DIR }}
        BUILDER_REPO: builder
        DEVICE: ${{ matrix.device }}
        COMMON: ${{ env.COMMON }}
        VARIANT: ${{ env.VARIANT }}
      run: |
        bash builder/scripts/prepare-build.sh

    - name: Download sources
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        make download -j$(nproc)

    - name: Build
      working-directory: ${{ env.OPENWRT_DIR }}
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: nssOpenwrt-${{ matrix.device }}
        path: |
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sysupgrade*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*factory*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*sha256*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*profiles*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*manifest*
          ${{ env.OPENWRT_DIR }}/bin/targets/**/*buildinfo*